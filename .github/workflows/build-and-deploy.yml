name: Sass Build and Deploy

on:
  push:
    branches:
      - main

env:
  DOCKER_IMAGE_NAME: kavi8667/backend
  

jobs:
  build-and-test-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build Sass
        run: npm run build

      - name: Build Docker image
        run: docker build -t ${{ env.DOCKER_IMAGE_NAME }}:sass .

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USER_NAME }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Push Docker image
        run: docker push ${{ env.DOCKER_IMAGE_NAME }}:sass

  deploy-job:
    env:
      DOCKER_CONTAINER_NAME: sass-backend

    needs: build-and-test-job
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.HOST_IP }}
          username: ubuntu
          key: ${{ secrets.AWS_EC2_KEY }}
          port: 22
          script: |
            sudo apt-get update
            sudo apt-get install -y git
            sudo git --version


            sudo apt-get install -y docker.io

            sudo systemctl start docker
            sudo systemctl enable docker

            sudo docker --version
            sudo systemctl status docker --no-pager
            git clone https://github.com/KAVI866/arshu.git
            sudo docker rmi ${{env.DOCKER_IMAGE_NAME}}
            sudo docker pull ${{ env.DOCKER_IMAGE_NAME }}:sass
            sudo docker stop ${{env.DOCKER_CONTAINER_NAME}} || true
            sudo docker rm ${{env.DOCKER_CONTAINER_NAME }} || true
            sudo docker run -d --name ${{ env.DOCKER_CONTAINER_NAME }} -p 3000:3000 ${{ env.DOCKER_IMAGE_NAME }}:sass